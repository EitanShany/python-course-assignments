[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immunoflow-discovery-analyzer"
version = "0.1.0"
description = "CLI milestone for ImmunoFlow Discovery Analyzer."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["immunoflow_discovery_analyzer*"]

[tool.pytest.ini_options]
pythonpath = ["."]
